name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.13'
  ANDROID_PLATFORM: '36'
  BUILD_TOOLS: '36.0.0'
  APK_SIZE_LIMIT_BYTES: '262144'
  APP_VERSION_CODE: ${{ github.run_number }}

jobs:
  quality:
    name: Build, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      stable_signing: ${{ steps.signing.outputs.enabled }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Install and pin Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS}"

          # Hosted runners can contain preview/future Android platforms.
          # Keep lint deterministic instead of suppressing OldTargetApi.
          find "$ANDROID_HOME/platforms" \
            -mindepth 1 -maxdepth 1 -type d -name 'android-*' \
            ! -name "android-${ANDROID_PLATFORM}" \
            -print -exec rm -rf {} +

          test -d "$ANDROID_HOME/platforms/android-${ANDROID_PLATFORM}"

      - name: Prepare stable release signing
        id: signing
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [[ -z "${SIGNING_PASSPHRASE:-}" ]]; then
            echo "Stable signing secret is not configured; CI will verify a debug APK and skip GitHub Release publication."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "STABLE_SIGNING=false" >> "$GITHUB_ENV"
            exit 0
          fi

          ENCRYPTED_KEYSTORE="$RUNNER_TEMP/autoscroller-release.jks.enc"
          KEYSTORE="$RUNNER_TEMP/autoscroller-release.jks"
          base64 -d .github/signing/autoscroller-release.jks.enc.b64 > "$ENCRYPTED_KEYSTORE"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$ENCRYPTED_KEYSTORE" \
            -out "$KEYSTORE" \
            -pass env:SIGNING_PASSPHRASE
          chmod 600 "$KEYSTORE"

          keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass "$SIGNING_PASSPHRASE" \
            -alias autoscroller \
            > signing-key-info.txt
          grep -Fq 'BB:98:91:BE:E0:FE:98:CA:46:A6:F0:A4:98:EF:59:FF:77:C4:72:76:2B:5E:F3:24:D5:45:1A:1A:16:90:96:7C' signing-key-info.txt

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$SIGNING_PASSPHRASE" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=autoscroller" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$SIGNING_PASSPHRASE" >> "$GITHUB_ENV"
          echo "STABLE_SIGNING=true" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Enforce source security policy
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '<uses-permission android:name="android.permission.INTERNET" />' app/src/main/AndroidManifest.xml
          grep -Fq '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' app/src/main/AndroidManifest.xml
          PERMISSION_COUNT="$(grep -c '<uses-permission ' app/src/main/AndroidManifest.xml)"
          if [[ "$PERMISSION_COUNT" != "2" ]]; then
            echo "ERROR: Only INTERNET and REQUEST_INSTALL_PACKAGES are permitted."
            exit 1
          fi

          if find app/src/main/java -name '*.java' ! -name 'UpdateManager.java' -print0 \
            | xargs -0 grep -InE 'java\.net\.|javax\.net\.'; then
            echo "ERROR: Network API found outside UpdateManager.java."
            exit 1
          fi

          if grep -RInE \
            'android\.webkit\.WebView|okhttp3\.|retrofit2\.|org\.apache\.http\.' \
            app/src/main/java; then
            echo "ERROR: Unexpected network stack found in production source."
            exit 1
          fi

          grep -Fq 'https://api.github.com/repos/imadraude/autoscroll-app/releases/latest' \
            app/src/main/java/com/imadraude/autoscroller/UpdateManager.java
          grep -Fq 'https://github.com/imadraude/autoscroll-app/releases/download/' \
            app/src/main/java/com/imadraude/autoscroller/UpdateManager.java

          if grep -RInF 'http://' app/src/main/java; then
            echo "ERROR: Plaintext HTTP is forbidden."
            exit 1
          fi

          if find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo "ERROR: Unencrypted key or certificate material must not be committed."
            exit 1
          fi

      - name: Unit tests, lint and both builds
        run: >
          gradle --no-daemon --stacktrace --warning-mode all
          clean
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:lintRelease
          :app:assembleDebug
          :app:assembleRelease

      - name: Verify runtime dependency surface
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > debug-runtime-dependencies.txt
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > release-runtime-dependencies.txt

          grep -Fq "No dependencies" debug-runtime-dependencies.txt || {
            cat debug-runtime-dependencies.txt
            echo "ERROR: Unexpected debug runtime dependency."
            exit 1
          }

          grep -Fq "No dependencies" release-runtime-dependencies.txt || {
            cat release-runtime-dependencies.txt
            echo "ERROR: Unexpected release runtime dependency."
            exit 1
          }

      - name: Audit generated APK
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          SIGNED_RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          UNSIGNED_RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          AAPT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          test -f "$DEBUG_APK"
          if [[ "${STABLE_SIGNING:-false}" == "true" ]]; then
            test -f "$SIGNED_RELEASE_APK"
            APK="$SIGNED_RELEASE_APK"
          else
            test -f "$UNSIGNED_RELEASE_APK"
            APK="$DEBUG_APK"
          fi

          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee permissions.txt

          grep -Fq "package: name='com.imadraude.autoscroller' versionCode='${APP_VERSION_CODE}' versionName='1.0'" apk-badging.txt
          grep -Fq "sdkVersion:'26'" apk-badging.txt
          grep -Fq "targetSdkVersion:'36'" apk-badging.txt

          grep -Fq "uses-permission: name='android.permission.INTERNET'" permissions.txt
          grep -Fq "uses-permission: name='android.permission.REQUEST_INSTALL_PACKAGES'" permissions.txt
          UNEXPECTED_PERMISSIONS="$(grep -F 'uses-permission:' permissions.txt \
            | grep -vF "android.permission.INTERNET" \
            | grep -vF "android.permission.REQUEST_INSTALL_PACKAGES" || true)"
          if [[ -n "$UNEXPECTED_PERMISSIONS" ]]; then
            printf '%s\n' "$UNEXPECTED_PERMISSIONS"
            echo "ERROR: Generated APK requests an unexpected permission."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt
          if [[ "${STABLE_SIGNING:-false}" == "true" ]]; then
            grep -Fqi 'bb9891bee0fe98ca46a6f0a498ef59ff77c472762b5ef324d5451a1a1690967c' signature.txt
          fi

          unzip -l "$APK" | tee apk-contents.txt
          if grep -Eq '[[:space:]]lib/.*\.so$' apk-contents.txt; then
            echo "ERROR: Unexpected native library in APK."
            exit 1
          fi

          APK_SIZE="$(stat -c%s "$APK")"
          echo "$APK_SIZE" | tee apk-size-bytes.txt
          if (( APK_SIZE > APK_SIZE_LIMIT_BYTES )); then
            echo "ERROR: APK exceeds ${APK_SIZE_LIMIT_BYTES} bytes (${APK_SIZE} bytes)."
            exit 1
          fi

          printf '%s\n' "${STABLE_SIGNING:-false}" > stable-signing.txt
          cp "$APK" AutoScroller-Lite-v1.0.apk
          sha256sum AutoScroller-Lite-v1.0.apk | tee AutoScroller-Lite-v1.0.apk.sha256

      - name: Upload verified APK
        uses: actions/upload-artifact@v7
        with:
          name: AutoScroller-Lite-v1.0
          path: |
            AutoScroller-Lite-v1.0.apk
            AutoScroller-Lite-v1.0.apk.sha256
            permissions.txt
            signature.txt
            apk-badging.txt
            apk-size-bytes.txt
            stable-signing.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            app/build/reports/
            debug-runtime-dependencies.txt
            release-runtime-dependencies.txt
            apk-contents.txt
            signing-key-info.txt
          if-no-files-found: warn
          retention-days: 30

  emulator-smoke:
    name: Emulator smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Install SDK and emulator
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS}" \
            "system-images;android-${ANDROID_PLATFORM};google_apis;x86_64"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Boot emulator and exercise app
        shell: bash
        run: |
          set -euo pipefail

          ADB="$ANDROID_HOME/platform-tools/adb"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          APK="app/build/outputs/apk/debug/app-debug.apk"

          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          diagnose() {
            echo "=== adb devices ==="
            "$ADB" devices -l || true
            echo "=== AVD list ==="
            "$EMULATOR" -list-avds || true
            echo "=== AVD directory ==="
            find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print 2>/dev/null || true
            echo "=== emulator process ==="
            ps -ef | grep '[e]mulator' || true
            echo "=== emulator log tail ==="
            tail -n 250 emulator.log 2>/dev/null || true
          }

          echo "no" | "$AVDMANAGER" create avd \
            --force \
            --name ciApi36 \
            --package "system-images;android-${ANDROID_PLATFORM};google_apis;x86_64" \
            --path "$ANDROID_AVD_HOME/ciApi36.avd"

          "$EMULATOR" -list-avds | tee avd-list.txt
          grep -Fxq "ciApi36" avd-list.txt

          sudo chmod 666 /dev/kvm || true
          "$EMULATOR" -accel-check | tee emulator-accel.txt || true

          "$ADB" kill-server || true
          "$ADB" start-server

          nohup "$EMULATOR" \
            -avd ciApi36 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader \
            > emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > emulator.pid

          cleanup() {
            "$ADB" emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          if ! timeout 120s "$ADB" wait-for-device; then
            echo "ERROR: emulator did not appear in adb within 120 seconds."
            diagnose
            exit 1
          fi

          BOOTED=""
          BOOT_DEADLINE=$((SECONDS + 300))
          while (( SECONDS < BOOT_DEADLINE )); do
            BOOTED="$(timeout 10s "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$BOOTED" == "1" ]]; then
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: emulator process exited before Android booted."
              diagnose
              exit 1
            fi
            sleep 5
          done

          if [[ "$BOOTED" != "1" ]]; then
            echo "ERROR: Android did not finish booting within 300 seconds."
            diagnose
            exit 1
          fi

          timeout 60s "$ADB" install -r "$APK"

          timeout 15s "$ADB" logcat -c
          timeout 30s "$ADB" shell am start -W -n com.imadraude.autoscroller/.MainActivity | tee activity-launch.txt
          grep -Fq "Status: ok" activity-launch.txt

          sleep 2
          test -n "$(timeout 15s "$ADB" shell pidof com.imadraude.autoscroller | tr -d '\r')"

          timeout 15s "$ADB" shell settings put secure enabled_accessibility_services \
            com.imadraude.autoscroller/com.imadraude.autoscroller.AutoScrollService
          timeout 15s "$ADB" shell settings put secure accessibility_enabled 1

          sleep 3
          timeout 30s "$ADB" shell dumpsys accessibility | tee accessibility-state.txt
          grep -Fq "com.imadraude.autoscroller.AutoScrollService" accessibility-state.txt

          timeout 30s "$ADB" logcat -d | tee logcat.txt
          if grep -A8 -F "FATAL EXCEPTION" logcat.txt | grep -Fq "Process: com.imadraude.autoscroller"; then
            echo "ERROR: App crashed during emulator smoke test."
            exit 1
          fi

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke-diagnostics
          path: |
            emulator.log
            emulator-accel.txt
            emulator.pid
            avd-list.txt
            activity-launch.txt
            accessibility-state.txt
            logcat.txt
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build for CodeQL
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  release:
    name: Publish GitHub Release
    needs: [quality, emulator-smoke, codeql]
    if: >-
      needs.quality.outputs.stable_signing == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v8
        with:
          name: AutoScroller-Lite-v1.0
          path: release

      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"

          grep -Fxq 'true' release/stable-signing.txt

          gh release create "$TAG" \
            release/AutoScroller-Lite-v1.0.apk \
            release/AutoScroller-Lite-v1.0.apk.sha256 \
            release/permissions.txt \
            release/signature.txt \
            --target "$GITHUB_SHA" \
            --title "AutoScroller Lite — build #${GITHUB_RUN_NUMBER}" \
            --notes "Автоматичний стабільно підписаний білд. Усі CI-перевірки пройдені: unit tests, strict lint, debug/release build, APK audit, CodeQL та Android 16 emulator smoke test. Застосунок перевіряє цей GitHub Release для автооновлень." \
            --latest
