name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.9'
  ANDROID_PLATFORM: '35'
  BUILD_TOOLS: '35.0.0'
  APK_SIZE_LIMIT_BYTES: '262144'

jobs:
  quality:
    name: Build, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Enforce source privacy policy
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE '<uses-permission([[:space:]]|>)' app/src/main/AndroidManifest.xml; then
            echo "ERROR: This app is designed to request zero app permissions."
            exit 1
          fi

          if grep -RInE \
            'java\.net\.|javax\.net\.|android\.webkit\.WebView|okhttp3\.|retrofit2\.|org\.apache\.http\.' \
            app/src/main/java; then
            echo "ERROR: Network-capable API found in production source."
            exit 1
          fi

          if find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo "ERROR: Key or certificate material must not be committed."
            exit 1
          fi

      - name: Unit tests, lint and both builds
        run: >
          gradle --no-daemon --stacktrace --warning-mode all
          clean
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:lintRelease
          :app:assembleDebug
          :app:assembleRelease

      - name: Verify runtime dependency surface
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > debug-runtime-dependencies.txt
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > release-runtime-dependencies.txt

          grep -Fq "No dependencies" debug-runtime-dependencies.txt || {
            cat debug-runtime-dependencies.txt
            echo "ERROR: Unexpected debug runtime dependency."
            exit 1
          }

          grep -Fq "No dependencies" release-runtime-dependencies.txt || {
            cat release-runtime-dependencies.txt
            echo "ERROR: Unexpected release runtime dependency."
            exit 1
          }

      - name: Audit generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          AAPT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          test -f "$APK"
          test -f "$RELEASE_APK"

          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee permissions.txt

          grep -Fq "package: name='com.imadraude.autoscroller' versionCode='1' versionName='1.0'" apk-badging.txt
          grep -Fq "sdkVersion:'26'" apk-badging.txt
          grep -Fq "targetSdkVersion:'35'" apk-badging.txt

          if grep -Eq 'uses-permission|android.permission.INTERNET|android.permission.ACCESS_NETWORK_STATE' permissions.txt; then
            echo "ERROR: Generated APK requests a permission."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt

          unzip -l "$APK" | tee apk-contents.txt
          if grep -Eq '[[:space:]]lib/.*\.so$' apk-contents.txt; then
            echo "ERROR: Unexpected native library in APK."
            exit 1
          fi

          APK_SIZE="$(stat -c%s "$APK")"
          echo "$APK_SIZE" | tee apk-size-bytes.txt
          if (( APK_SIZE > APK_SIZE_LIMIT_BYTES )); then
            echo "ERROR: APK exceeds ${APK_SIZE_LIMIT_BYTES} bytes (${APK_SIZE} bytes)."
            exit 1
          fi

          cp "$APK" AutoScroller-Lite-v1.0-debug.apk
          sha256sum AutoScroller-Lite-v1.0-debug.apk | tee AutoScroller-Lite-v1.0-debug.apk.sha256

      - name: Upload verified APK
        uses: actions/upload-artifact@v7
        with:
          name: AutoScroller-Lite-v1.0
          path: |
            AutoScroller-Lite-v1.0-debug.apk
            AutoScroller-Lite-v1.0-debug.apk.sha256
            permissions.txt
            signature.txt
            apk-badging.txt
            apk-size-bytes.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            app/build/reports/
            debug-runtime-dependencies.txt
            release-runtime-dependencies.txt
            apk-contents.txt
          if-no-files-found: warn
          retention-days: 30

  emulator-smoke:
    name: Emulator smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Install SDK and emulator
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS}" \
            "system-images;android-${ANDROID_PLATFORM};google_apis;x86_64"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Boot emulator and exercise app
        shell: bash
        run: |
          set -euo pipefail

          ADB="$ANDROID_HOME/platform-tools/adb"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "no" | "$AVDMANAGER" create avd \
            --force \
            --name ciApi35 \
            --package "system-images;android-${ANDROID_PLATFORM};google_apis;x86_64"

          sudo chmod 666 /dev/kvm || true

          nohup "$EMULATOR" \
            -avd ciApi35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > emulator.log 2>&1 &

          "$ADB" wait-for-device

          BOOTED=""
          for _ in $(seq 1 72); do
            BOOTED="$("$ADB" shell getprop sys.boot_completed | tr -d '\r')"
            if [[ "$BOOTED" == "1" ]]; then
              break
            fi
            sleep 5
          done
          test "$BOOTED" = "1"

          "$ADB" install -r "$APK"

          "$ADB" logcat -c
          "$ADB" shell am start -W -n com.imadraude.autoscroller/.MainActivity | tee activity-launch.txt
          grep -Fq "Status: ok" activity-launch.txt

          sleep 2
          test -n "$("$ADB" shell pidof com.imadraude.autoscroller | tr -d '\r')"

          "$ADB" shell settings put secure enabled_accessibility_services \
            com.imadraude.autoscroller/com.imadraude.autoscroller.AutoScrollService
          "$ADB" shell settings put secure accessibility_enabled 1

          sleep 3
          "$ADB" shell dumpsys accessibility | tee accessibility-state.txt
          grep -Fq "com.imadraude.autoscroller.AutoScrollService" accessibility-state.txt

          "$ADB" logcat -d | tee logcat.txt
          if grep -A8 -F "FATAL EXCEPTION" logcat.txt | grep -Fq "Process: com.imadraude.autoscroller"; then
            echo "ERROR: App crashed during emulator smoke test."
            exit 1
          fi

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke-diagnostics
          path: |
            emulator.log
            activity-launch.txt
            accessibility-state.txt
            logcat.txt
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build for CodeQL
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
