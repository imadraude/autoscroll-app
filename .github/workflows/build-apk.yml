name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK and privacy constraint
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$APK"
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          if grep -Fq "android.permission.INTERNET" permissions.txt; then
            echo "ERROR: INTERNET permission found"
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" AutoScroller-Lite-v1.0-debug.apk
          sha256sum AutoScroller-Lite-v1.0-debug.apk | tee AutoScroller-Lite-v1.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoScroller-Lite-v1.0
          path: |
            AutoScroller-Lite-v1.0-debug.apk
            AutoScroller-Lite-v1.0-debug.apk.sha256
            permissions.txt
          if-no-files-found: error
